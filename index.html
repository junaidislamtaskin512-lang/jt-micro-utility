<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JT Micro Utility</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #007BFF;
            margin-bottom: 5px;
        }
        p {
            color: #666;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h3 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-copy {
            background: #28a745;
            color: white;
        }
        .btn-copy:hover {
            background: #218838;
        }
        .btn-generate {
            width: 100%;
            background: #007BFF;
            color: white;
        }
        .btn-generate:hover {
            background: #0056b3;
        }
        .ad-container {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>JT Micro Utility</h1>
        <p>Fast and easy online tools for your daily needs.</p>
    </header>

    <!-- Utility Feature: Password Generator -->
    <div class="container">
        <h3>Instant Password Generator</h3>
        <div class="input-group">
            <input type="text" id="generatedPassword" readonly placeholder="Click generate...">
            <button class="btn-copy" onclick="copyPassword()">Copy</button>
        </div>
        <button class="btn-generate" onclick="generatePassword()">Generate Password</button>
    </div>

    <!-- Adsterra Ad Code Integration -->
    <div class="container ad-container">
        <script data-cfasync="false" src="https://bauval.org/14/a0bf2999fe8463c6c3a473854470e8ce"></script>
    </div>

    <script>
        function generatePassword() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+";
            let password = "";
            for (let i = 0; i < 12; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById("generatedPassword").value = password;
        }

        function copyPassword() {
            const passwordBox = document.getElementById("generatedPassword");
            if(passwordBox.value === "") {
                alert("Please generate a password first!");
                return;
            }
            passwordBox.select();
            document.execCommand("copy");
            alert("Password copied to clipboard!");
        }
    </script>

</body>
</html>
